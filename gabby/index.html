<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>La Casita de Gabby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@800;900&display=swap">
<style>
  :root {
    --sky: #f4e2ff;
    --pink: #ff4fa3;
    --purple: #8a3fd1;
    --lilac: #a66be0;
    --ink: #3e2350;
    --font-fun: "Fredoka", "Nunito", system-ui, sans-serif;
    --font-ui: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--sky); }
  body { font-family: var(--font-ui); color: var(--ink); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  button { font: inherit; cursor: pointer; }

  /* HUD */
  #hud { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 0 12px; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  .round { width: 58px; height: 58px; border-radius: 50%; border: 4px solid #fff; background: var(--lilac); color: #fff; font-size: 26px; box-shadow: 0 4px 0 rgba(0,0,0,.25); display: grid; place-items: center; flex: none; }
  .round:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .round.off { background: #8a93a8; }
  #mission { background: #fff; border: 4px solid var(--pink); border-radius: 22px; padding: 6px 16px 8px; text-align: center; box-shadow: 0 4px 0 rgba(0,0,0,.2); max-width: min(560px, 100%); }
  #missionText { font-family: var(--font-fun); font-size: clamp(16px, 3.6vw, 24px); color: var(--purple); letter-spacing: .5px; }
  #progress { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 4px; font-size: clamp(14px, 3.4vw, 28px); line-height: 1.15; }
  #progress span { filter: grayscale(1); opacity: .3; transition: transform .25s, opacity .25s; }
  #progress span.got { filter: none; opacity: 1; transform: scale(1.15); }

  #bubble { position: fixed; left: 50%; top: 110px; transform: translate(-50%, -10px); background: #fff; border-radius: 20px; padding: 10px 18px; font-size: clamp(16px, 3.4vw, 22px); font-weight: 900; box-shadow: 0 4px 0 rgba(0,0,0,.18); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; text-align: center; max-width: 90vw; }
  #bubble.show { opacity: 1; transform: translate(-50%, 0); }

  #banner { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
  #banner div { font-family: var(--font-fun); font-weight: 700; font-size: clamp(34px, 9vw, 78px); color: var(--pink); text-align: center; line-height: 1.05; padding: 0 16px; -webkit-text-stroke: 3px #fff; paint-order: stroke fill; text-shadow: 0 6px 0 var(--purple); animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
  #banner small { display: block; font-size: .45em; color: #fff; -webkit-text-stroke: 2px var(--lilac); text-shadow: 0 3px 0 var(--lilac); margin-top: 8px; }
  @keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  #actBtn { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); width: 104px; height: 104px; border-radius: 50%; border: 5px solid #fff; background: var(--pink); color: #fff; font-size: 34px; line-height: 1; box-shadow: 0 6px 0 #a3226a; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #actBtn small { font-family: var(--font-fun); font-size: 15px; margin-top: 2px; }
  #actBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #a3226a; }
  #actBtn.glow { animation: glow .8s ease-in-out infinite; }
  @keyframes glow { 50% { transform: scale(1.12); box-shadow: 0 6px 0 #a3226a, 0 0 0 10px rgba(255,79,163,.35); } }
  #lanes { position: fixed; left: max(16px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom)); display: flex; gap: 12px; }
  #lanes button { width: 86px; height: 86px; border-radius: 50%; border: 5px solid #fff; background: var(--lilac); color: #fff; font-size: 34px; box-shadow: 0 6px 0 #5b2d94; }
  #lanes button:active { transform: translateY(4px); box-shadow: 0 2px 0 #5b2d94; }
  #hint { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: rgba(62,35,80,.85); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 900; font-size: clamp(14px, 3vw, 19px); pointer-events: none; white-space: nowrap; animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translate(-50%, -6px); } }
  @media (max-width: 560px) { #hint { bottom: 130px; } }
  #fade { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .35s; }
  #fade.on { opacity: 1; }

  /* Pantallas */
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; overflow-y: auto; text-align: center; }
  #title { background: linear-gradient(180deg, rgba(244,226,255,.95) 0%, rgba(244,226,255,.6) 45%, rgba(244,226,255,0) 100%); justify-content: flex-start; padding-top: max(18px, env(safe-area-inset-top)); }
  .back { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 16px; font-family: var(--font-fun); font-size: 18px; color: #fff; text-decoration: none; background: var(--lilac); padding: 8px 14px; border-radius: 999px; border: 3px solid #fff; }
  .logo { margin-top: 58px; display: flex; flex-direction: column; align-items: center; }
  .logo .t0 { font-family: var(--font-fun); font-size: clamp(18px, 4.4vw, 30px); color: #fff; -webkit-text-stroke: 2px var(--purple); paint-order: stroke fill; }
  .logo .t1 { font-family: var(--font-fun); font-weight: 700; font-size: clamp(46px, 11vw, 100px); line-height: .95; color: var(--pink); -webkit-text-stroke: 4px #fff; paint-order: stroke fill; text-shadow: 0 8px 0 var(--purple), 0 12px 18px rgba(0,0,0,.25); transform: rotate(-3deg); }
  .logo .t2 { font-family: var(--font-fun); font-size: clamp(18px, 4.4vw, 32px); color: #fff; background: var(--purple); padding: 6px 18px 3px; border-radius: 12px; border: 3px solid #fff; margin-top: 12px; transform: rotate(2deg); box-shadow: 0 5px 0 rgba(0,0,0,.2); }
  .ask { font-family: var(--font-fun); font-size: clamp(20px, 4.6vw, 32px); color: var(--purple); margin: 10px 0 0; -webkit-text-stroke: 1px #fff; }
  #picks { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
  .pick { width: clamp(118px, 28vw, 180px); background: #fff; border: 5px solid var(--c); border-radius: 22px; padding: 6px 6px 10px; box-shadow: 0 7px 0 var(--c); display: flex; flex-direction: column; align-items: center; transition: transform .15s; }
  .pick:hover, .pick:focus-visible { transform: translateY(-5px) rotate(-1.5deg); outline: none; }
  .pick:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--c); }
  .pick img { width: 100%; aspect-ratio: 1; border-radius: 14px; background: radial-gradient(circle at 50% 40%, #fff6fb, #e6d0ff); }
  .pick span { font-family: var(--font-fun); font-size: clamp(20px, 4.4vw, 30px); color: var(--c); margin-top: 4px; }
  .levels { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 4px; }
  .levels span { background: #fff; border: 3px solid var(--lilac); border-radius: 999px; padding: 4px 12px; font-weight: 900; font-size: 15px; color: var(--purple); }
  .small { font-size: 13px; color: var(--ink); opacity: .75; margin: 6px 0 0; max-width: 520px; }

  #end { justify-content: flex-end; padding-bottom: max(28px, env(safe-area-inset-bottom)); pointer-events: none; }
  #end .panel { pointer-events: auto; background: rgba(255,255,255,.92); border: 5px solid var(--pink); border-radius: 26px; padding: 14px 22px 18px; box-shadow: 0 8px 0 rgba(0,0,0,.2); }
  #end h2 { font-family: var(--font-fun); font-size: clamp(30px, 7vw, 56px); margin: 0; color: var(--purple); }
  #end p { margin: 4px 0 12px; font-weight: 900; font-size: 18px; }
  .big { font-family: var(--font-fun); font-size: 24px; color: #fff; background: #3fae49; border: 4px solid #fff; border-radius: 999px; padding: 12px 26px 8px; box-shadow: 0 6px 0 #22752a; margin: 4px; text-decoration: none; display: inline-block; }
  .big.alt { background: var(--lilac); box-shadow: 0 6px 0 #5b2d94; }
  .big:active { transform: translateY(4px); box-shadow: none; }
  .nogl { padding: 40px 20px; text-align: center; font-size: 20px; font-weight: 900; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <button id="homeBtn" class="round" aria-label="Volver al inicio">🏠</button>
  <div id="mission"><div id="missionText"></div><div id="progress"></div></div>
  <button id="musicBtn" class="round" aria-label="Música">🎵</button>
</div>
<div id="bubble"></div>
<div id="banner"></div>
<div id="lanes" hidden>
  <button id="leftBtn" aria-label="Izquierda">◀</button>
  <button id="rightBtn" aria-label="Derecha">▶</button>
</div>
<button id="actBtn" hidden aria-label="Saltar"></button>
<div id="hint" hidden></div>
<div id="fade"></div>

<div id="title" class="overlay">
  <a class="back" href="../">◀ Juegos</a>
  <div class="logo"><span class="t0">La Casita de</span><span class="t1">GABBY</span><span class="t2">¡Fiesta con los gatitos!</span></div>
  <p class="ask">¿Con quién quieres jugar?</p>
  <div id="picks"></div>
  <div class="levels"><span>🚧 Esquiva los conos</span><span>💞 Corazones con amigos</span><span>⭕ Hula hula</span></div>
  <p class="small">Toca la pantalla para jugar. ¡No se puede perder!</p>
</div>

<div id="end" class="overlay" hidden>
  <div class="panel">
    <h2>¡Lo lograste!</h2>
    <p>¡Fiesta en la casita con todos los gatitos! 🐱💖</p>
    <button id="againBtn" class="big">▶ Jugar otra vez</button>
    <a class="big alt" href="../">◀ Juegos</a>
  </div>
</div>

<noscript><p class="nogl">Este juego necesita JavaScript.</p></noscript>

<script type="module">
import * as THREE from './three.module.min.js';
import { canvasTex, stripeTex, M, mk, pivot, sphere, cyl, box, cone, heartGeo, heartM, halfHeartGeo, starGeo, goldM, makeGabby, makePandy, makeCakey, makeMerCat, makeFairy, makeDJ, makePillow, makeBabyBox } from './personajes.js';

const $ = (id) => document.getElementById(id);
const V3 = THREE.Vector3;
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

/* ============================================================
   Motor 3D
   ============================================================ */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
} catch (e) {
  document.body.innerHTML = '<p class="nogl">Este juego necesita un navegador con gráficos 3D (WebGL).</p>';
  throw e;
}
const SMALL = Math.min(innerWidth, innerHeight) < 600;
renderer.setPixelRatio(Math.min(window.devicePixelRatio, SMALL ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const SKY = 0xf1dcff;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 30, 62);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 160);

function addLights(sc, shadows) {
  sc.add(new THREE.HemisphereLight(0xfff6fb, 0x9a86b8, 1.6));
  const sun = new THREE.DirectionalLight(0xfff0e0, 2.4);
  sun.position.set(-7, 15, 9);
  if (shadows) {
    sun.castShadow = true;
    sun.shadow.mapSize.set(SMALL ? 1024 : 2048, SMALL ? 1024 : 2048);
    Object.assign(sun.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15, near: 1, far: 45 });
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.03;
  }
  sc.add(sun);
  const fill = new THREE.DirectionalLight(0xe6d6ff, 0.7);
  fill.position.set(8, 6, 12);
  sc.add(fill);
}
addLights(scene, true);

/* ---------- Texturas dibujadas con canvas ---------- */
const makeGrass = () => canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#8fd67a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) {
    const x = Math.random() * w, y = Math.random() * h;
    g.strokeStyle = Math.random() < 0.5 ? 'rgba(60,140,60,.4)' : 'rgba(180,235,150,.5)';
    g.lineWidth = 2;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + rand(-3, 3), y - rand(5, 11)); g.stroke();
  }
  const cols = ['#ffffff', '#ffc4e6', '#fff38a', '#d9b8ff'];
  for (let i = 0; i < 70; i++) {
    const x = Math.random() * w, y = Math.random() * h;
    g.fillStyle = pick(cols);
    for (let k = 0; k < 5; k++) { const a = k / 5 * TAU; g.beginPath(); g.arc(x + Math.cos(a) * 3, y + Math.sin(a) * 3, 2.6, 0, TAU); g.fill(); }
    g.fillStyle = '#ffcf3a'; g.beginPath(); g.arc(x, y, 1.8, 0, TAU); g.fill();
  }
}, [1, 1]);
// Camino rosa con tres carriles
const roadTex = canvasTex(256, 128, (g, w, h) => {
  g.fillStyle = '#ffc7e3'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#b77ee8'; g.fillRect(0, 0, 12, h); g.fillRect(w - 12, 0, 12, h);
  g.fillStyle = '#ffffff'; g.fillRect(12, 0, 6, h); g.fillRect(w - 18, 0, 6, h);
  for (const u of [w / 3, w * 2 / 3]) g.fillRect(u - 4, 0, 8, h / 2);
  g.fillStyle = 'rgba(255,255,255,.55)';
  for (const [x, y] of [[60, 90], [190, 30]]) {
    g.beginPath(); g.ellipse(x, y, 7, 6, 0, 0, TAU); g.fill();
    for (let k = 0; k < 4; k++) { g.beginPath(); g.arc(x - 7.5 + k * 5, y - 9 - (k % 3 ? 2 : 0), 2.6, 0, TAU); g.fill(); }
  }
}, [1, 35]);
const checkerTex = canvasTex(256, 64, (g, w, h) => {
  for (let i = 0; i < 16; i++) for (let j = 0; j < 4; j++) { g.fillStyle = (i + j) % 2 ? '#ff4fa3' : '#ffffff'; g.fillRect(i * 16, j * 16, 16, 16); }
});
const doorTex = canvasTex(128, 256, (g, w, h) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#d3a6f2'; g.lineWidth = 8; g.strokeRect(10, 10, w - 20, h - 20);
  g.fillStyle = '#ff5fa2';
  g.beginPath(); g.moveTo(64, 120); g.bezierCurveTo(30, 90, 30, 50, 64, 70); g.bezierCurveTo(98, 50, 98, 90, 64, 120); g.fill();
  g.fillStyle = '#ffd23f'; g.beginPath(); g.arc(100, 150, 8, 0, TAU); g.fill();
});

/* ---------- Personajes del juego ---------- */
const PLAYABLE = [
  { name: 'Gabby', make: makeGabby, color: '#ff4fa3', line: '¡Hola! ¡Vamos a jugar con los gatitos!' },
  { name: 'Pandy', make: makePandy, color: '#3e3550', line: '¡Hola! ¡Soy Pandy! ¡A jugar!' },
  { name: 'Cakey', make: makeCakey, color: '#2fb5ae', line: '¡Hola! ¡Soy Cakey! ¡Qué divertido!' },
];
const FRIENDS = [
  { name: 'MerCat', make: makeMerCat, emoji: '🧜‍♀️', spot: [-5.6, -2.6] },
  { name: 'la Gatita Hada', make: makeFairy, emoji: '🧚', spot: [5.6, -3.0] },
  { name: 'DJ Gatito', make: makeDJ, emoji: '🎧', spot: [-5.8, 6.0] },
  { name: 'la Gatita Almohada', make: makePillow, emoji: '💤', spot: [5.8, 6.4] },
  { name: 'Bebé Caja', make: makeBabyBox, emoji: '📦', spot: [0, 9.2] },
];

/* ============================================================
   La casita de muñecas (con orejas de gato en el techo)
   ============================================================ */
function buildDollhouse(parent, x, z, s = 1) {
  const h = pivot(parent, x, 0, z);
  h.scale.setScalar(s);
  const pinkW = M(0xff9fd0, { roughness: 0.6 }), white = M(0xffffff, { roughness: 0.5 }), roofM = M(0xa66be0, { roughness: 0.5 });
  mk(box(7, 5.2, 3.4), pinkW, h, 0, 2.6, 0);
  for (const y of [1.75, 3.5]) mk(box(7.1, 0.16, 3.5), white, h, 0, y, 0);
  const rooms = [0xfff2a8, 0xbfe6ff, 0xd9ffd0, 0xffd6ec];
  let k = 0;
  for (const y of [2.65, 4.35]) for (const wx of [-2.4, 2.4]) {
    mk(box(1.6, 1.15, 0.12), white, h, wx, y, 1.72);
    mk(box(1.3, 0.9, 0.14), M(rooms[k++ % 4], { roughness: 0.2, emissive: rooms[k % 4], emissiveIntensity: 0.25 }), h, wx, y, 1.73);
    mk(box(0.06, 0.9, 0.16), white, h, wx, y, 1.74);
    mk(box(1.7, 0.14, 0.4), M(0xff6fb5), h, wx, y - 0.62, 1.82);
  }
  mk(box(1.4, 2.0, 0.12), new THREE.MeshStandardMaterial({ map: doorTex, roughness: 0.6 }), h, 0, 1.0, 1.72);
  mk(new THREE.CylinderGeometry(0.7, 0.7, 0.12, 24, 1, false, -Math.PI / 2, Math.PI), white, h, 0, 2.0, 1.72).rotation.x = Math.PI / 2;
  const hb = mk(heartGeo, heartM, h, 0, 3.0, 1.82);
  hb.scale.setScalar(0.7);
  // Techo triangular con orejas de gato
  const tri = new THREE.Shape();
  tri.moveTo(-3.9, 0); tri.lineTo(3.9, 0); tri.lineTo(0, 3.0); tri.closePath();
  mk(new THREE.ExtrudeGeometry(tri, { depth: 3.8, bevelEnabled: false }), roofM, h, 0, 5.2, -1.9);
  for (const sx of [-1, 1]) {
    const ear = pivot(h, sx * 2.0, 6.55, 0);
    ear.rotation.z = -sx * 0.5;
    mk(cone(0.75, 1.5, 4), roofM, ear, 0, 0.5, 0).rotation.y = Math.PI / 4;
    mk(cone(0.45, 0.95, 4), M(0xffb6e0), ear, 0, 0.38, 0.32).rotation.y = Math.PI / 4;
  }
  // Ventana redonda con carita de gato en el techo
  const face = pivot(h, 0, 6.15, 1.92);
  mk(cyl(0.85, 0.85, 0.1, 32), white, face).rotation.x = Math.PI / 2;
  mk(cyl(0.7, 0.7, 0.12, 32), M(0xffe6f4), face).rotation.x = Math.PI / 2;
  for (const sx of [-1, 1]) {
    mk(sphere(0.12, 12, 10), M(0x3e2350), face, sx * 0.28, 0.08, 0.06).scale.set(0.8, 1.2, 0.4);
    for (const k2 of [-1, 1]) mk(box(0.4, 0.03, 0.02), M(0x3e2350), face, sx * 0.5, -0.15 + k2 * 0.08, 0.07).rotation.z = sx * k2 * 0.15;
  }
  mk(sphere(0.07, 10, 8), M(0xff5f9e), face, 0, -0.1, 0.07);
  // Escalones
  mk(box(2.0, 0.2, 0.8), white, h, 0, 0.1, 2.1);
  return h;
}

/* ============================================================
   Mundo 1: el jardín de la casita
   ============================================================ */
const yard = new THREE.Group();
scene.add(yard);
const colliders = [];
const addCol = (x0, x1, z0, z1) => colliders.push({ x0, x1, z0, z1 });
const ROOM = { x: 9.55, zBack: -9.55, zFront: 11.5 };

function buildYard() {
  const grassTex = makeGrass();
  grassTex.repeat.set(14, 14);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.95 }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(0, 0, 3);
  ground.receiveShadow = true;
  yard.add(ground);

  // Cerca lila
  const fenceM = M(0xf4e6ff, { roughness: 0.5 });
  const picket = new THREE.Shape();
  picket.moveTo(-0.13, 0); picket.lineTo(0.13, 0); picket.lineTo(0.13, 1.2); picket.lineTo(0, 1.38); picket.lineTo(-0.13, 1.2); picket.closePath();
  const picketGeo = new THREE.ExtrudeGeometry(picket, { depth: 0.07, bevelEnabled: false });
  const fenceLine = (x0, z0, x1, z1) => {
    const len = Math.hypot(x1 - x0, z1 - z0), n = Math.round(len / 0.5), ang = Math.atan2(x1 - x0, z1 - z0);
    for (let i = 0; i <= n; i++) {
      const p = mk(picketGeo, fenceM, yard, x0 + (x1 - x0) * i / n, 0, z0 + (z1 - z0) * i / n);
      p.rotation.y = ang + Math.PI / 2;
    }
    for (const y of [0.35, 0.95]) {
      const rail = mk(box(0.06, 0.12, len), M(0xd9b8ff), yard, (x0 + x1) / 2, y, (z0 + z1) / 2);
      rail.rotation.y = ang;
    }
  };
  fenceLine(-10, -10, 10, -10);
  fenceLine(-10, -10, -10, 12.5);
  fenceLine(10, -10, 10, 12.5);

  buildDollhouse(yard, 0, -7.8);
  addCol(-3.6, 3.6, -9.7, -5.9);

function collide(p, r) {
  let nx = 0, nz = 0;
  if (p.x < -ROOM.x + r) { p.x = -ROOM.x + r; nx += 1; }
  if (p.x > ROOM.x - r) { p.x = ROOM.x - r; nx -= 1; }
  if (p.z < ROOM.zBack + r) { p.z = ROOM.zBack + r; nz += 1; }
  if (p.z > ROOM.zFront - r) { p.z = ROOM.zFront - r; nz -= 1; }
  for (const c of colliders) {
    const cx = clamp(p.x, c.x0, c.x1), cz = clamp(p.z, c.z0, c.z1);
    const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    if (d2 > 1e-8) {
      const d = Math.sqrt(d2);
      p.x = cx + dx / d * r; p.z = cz + dz / d * r;
      nx += dx / d; nz += dz / d;
    } else {
      const opts = [[p.x - c.x0, -1, 0], [c.x1 - p.x, 1, 0], [p.z - c.z0, 0, -1], [c.z1 - p.z, 0, 1]].sort((a, b) => a[0] - b[0]);
      const [dd, ox, oz] = opts[0];
      p.x += ox * (dd + r); p.z += oz * (dd + r);
      nx += ox; nz += oz;
    }
  }
  const n = Math.hypot(nx, nz);
  return n > 0 ? { x: nx / n, z: nz / n } : null;
}
function freeSpot(r) {
  for (const c of colliders) {
    if (r.x > c.x0 - 1.1 && r.x < c.x1 + 1.1 && r.z > c.z0 - 1.1 && r.z < c.z1 + 1.1) return false;
  }
  for (const f of FRIENDS) if (Math.abs(r.x - f.spot[0]) < 3.6 && Math.abs(r.z - f.spot[1]) < 1.2) return false;
  return true;
}

function osc(type, f, t, dur, gain, dest, { attack = 0.005, glideTo = 0, filter = 0 } = {}) {

function buildSong() {

  MELODY.forEach((bar, bi) => {
    const b0 = bi * 4;
    let pos = 0;
    for (const tok of bar.split(' ')) {
      const [n, l] = tok.split(':'); const len = parseFloat(l);
      if (n !== 'r') { const m = parseNote(n) - 12, s0 = b0 + pos; ev.push({ b: s0, fn: (t) => leadNote(t, m, len * SPB) }); }
      pos += len;
    }
    const ch = CH[CHORDS[bi]];

    for (let k = 0; k < 8; k++) ev.push({ b: b0 + k * 0.5, fn: (t) => osc('triangle', mtof(ch.root + (k % 2 ? 12 : 0)), t, 0.22, 0.22, musicBus) });

  if (!ac || ac.state !== 'running') return;

    const t = songT0 + (loopN * 64 + e.b) * SPB;
    if (t > horizon) break;
    if (t >= ac.currentTime - 0.03) e.fn(Math.max(t, ac.currentTime));
    if (++evI >= songEv.length) { evI = 0; loopN++; }
  }
}

let esVoice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  esVoice = vs.find((v) => /^es[-_](MX|US|419)/i.test(v.lang)) || vs.find((v) => /^es/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.addEventListener?.('voiceschanged', pickVoice); }
let bubbleTimer = 0;
function say(text, { show = true, interrupt = true } = {}) {
  if (show) {
    const b = $('bubble');
    b.textContent = text;
    b.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => b.classList.remove('show'), 2600);
  }
  if (!('speechSynthesis' in window)) return;
  try {
    if (interrupt) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[^\p{L}\p{N}\s¡!¿?,.]/gu, ''));
    u.lang = esVoice ? esVoice.lang : 'es-MX';
    if (esVoice) u.voice = esVoice;
    u.rate = 1.0; u.pitch = 1.2; u.volume = 1;
    speechSynthesis.speak(u);
  } catch (e) { /* sin voz, no pasa nada */ }
}
const NUM_F = ['¡Una!', '¡Dos!', '¡Tres!', '¡Cuatro!', '¡Cinco!', '¡Seis!', '¡Siete!', '¡Ocho!', '¡Nueve!', '¡Diez!'];

});

function animChar(R, dt, amt, t) {
  R.phase += dt * R.stepRate * amt;
  const sw = Math.sin(R.phase);
  R.legs.forEach((l, i) => { l.rotation.x = Math.sin(R.phase + (i % 2 ? Math.PI : 0)) * 0.65 * amt; });
  const breathe = Math.sin(t * 2.4 + R.h) * 0.02;
  const k = Math.min(1, dt * 12);
  R.arms.forEach((a, i) => {
    const s = i ? 1 : -1;
    let tz, tx;
    if (R.pose[i] != null) { tz = R.pose[i]; tx = 0; }
    else if (R.cheer > 0) { tz = s * (2.5 + 0.35 * Math.sin(t * 14 + i)); tx = 0; }
    else { tz = (a.userData.bz || 0) + breathe * s; tx = Math.sin(R.phase + (i ? 0 : Math.PI)) * 0.7 * amt; }
    a.rotation.z += (tz - a.rotation.z) * k;
    a.rotation.x += (tx - a.rotation.x) * k;
  });
  if (R.cheer > 0) R.cheer -= dt;
  R.body.position.y = Math.abs(sw) * 0.09 * amt + breathe;
  if (R.head) R.head.rotation.z = Math.sin(t * 1.7 + R.h) * 0.05 * (1 - amt);
  for (const w of R.wings) w.rotation.y = w.userData.s * (0.25 + Math.sin(t * 9 + R.h) * 0.35);
  if (R.tail) R.tail.rotation.y = Math.sin(t * 3 + R.h) * 0.35;
}
function turnTo(R, target, dt, rate = 10) {
  let d = target - R.root.rotation.y;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  R.root.rotation.y += d * Math.min(1, dt * rate);
}
function resetPose(R) {
  R.pose = [null, null];
  R.body.position.x = 0; R.body.position.z = 0;
  R.root.rotation.z = 0;
}

function changeLane(d) {
  if (state !== 'play' || LEVELS[levelIdx].id !== 'cones') return;
  const n = clamp(run.lane + d, 0, 2);
  if (n !== run.lane) { run.lane = n; SFX.swish(); }
  $('hint').hidden = true;
}
function updateRun(dt) {
  const R = player.R;
  const playing = state === 'play';
  if (run.go && playing) run.want = 6.5 + run.passed * 0.12;
  if (state === 'celebrate') run.want = 0;
  const slow = run.dizzy > 0 ? 0.55 : 1;
  run.speed += (run.want * slow - run.speed) * Math.min(1, dt * 2.5);
  const dz = run.speed * dt;
  roadTex.offset.y += dz / 4;
  runGrass.offset.y += dz / 4;
  for (const d of run.decor) { d.position.z += dz; if (d.position.z > 16) d.position.z -= 126; }
  run.arch.position.z += dz;
  run.house.position.z += dz;
  for (const row of run.rows) {
    row.z += dz;
    for (const c of row.cones) {
      if (c.v) {
        c.v.y -= 16 * dt;
        c.obj.position.addScaledVector(c.v, dt);
        c.obj.position.z += dz;
        c.obj.rotation.x += dt * 9; c.obj.rotation.z += dt * 6;
        if (c.obj.position.y < -3) c.obj.visible = false;
      } else c.obj.position.z = row.z;
    }
    if (row.paw) { row.paw.position.z = row.z; row.paw.rotation.y += dt * 3; row.paw.position.y = 0.9 + Math.sin(gameT * 4 + row.z) * 0.12; }
    if (!row.passed && row.z >= 0 && playing) passRow(row);
  }
  // Movimiento del personaje
  const tx = LANES[run.lane];
  run.x += (tx - run.x) * Math.min(1, dt * 11);
  player.vy -= 22 * dt;
  player.y += player.vy * dt;
  if (player.y < 0) { player.y = 0; player.vy = 0; }
  R.root.position.set(run.x, player.y, 0);
  if (run.dizzy > 0) {
    run.dizzy -= dt;
    R.root.rotation.y = Math.PI + (1 - Math.max(0, run.dizzy) / 0.8) * TAU;
  } else {
    R.root.rotation.y = Math.PI - (tx - run.x) * 0.25;
  }
  animChar(R, dt, player.y > 0 ? 0.3 : clamp(run.speed / 6.5, 0, 1), gameT);
  // ¿Llegamos a la meta?
  if (playing && run.passed >= run.rows.length && run.arch.position.z > -1) {
    burst(new V3(0, 3.5, run.arch.position.z), 60, { speed: 4, up: 4 });
    levelComplete();
  }
  for (let i = run.rows.length - 1; i >= 0; i--) {
    const row = run.rows[i];
    if (row.z > 14) { for (const c of row.cones) runWorld.remove(c.obj); if (row.paw) runWorld.remove(row.paw); row.done = true; }
  }
}
function passRow(row) {
  row.passed = true;
  run.passed++;
  let hit = null;
  for (const c of row.cones) if (Math.abs(LANES[c.lane] - run.x) < 0.95 && player.y < 0.8) hit = c;
  if (hit) {
    hit.v = new V3(rand(-2, 2) + (LANES[hit.lane] - run.x) * 3, 7, -2);
    run.dizzy = 0.8;
    SFX.bonk();
    say(pick(['¡Ups! ¡No pasa nada!', '¡Ay! ¡Sigue corriendo!', '¡Uy! ¡Tú puedes!']));
    burst(new V3(run.x, 1.2, 0), 14, { mats: goldMats, speed: 2.5, up: 3 });
  } else {
    SFX.chime(run.passed - 1);
    say(NUM_M[run.passed - 1], { show: false });
  }
  if (row.paw && Math.abs(LANES[row.pawLane] - run.x) < 0.9) {
    SFX.sparkle();
    burst(row.paw.position.clone(), 18, { mats: pinkMats, speed: 2.5, up: 4 });
    runWorld.remove(row.paw);
    row.paw = null;
  }
  addProgress();
}

/* ============================================================
   Nivel 2: corazones con amigos
   ============================================================ */
const HALF_SCALE = 1.15, HALF_W = 0.5 * HALF_SCALE;
const halves = halfHeartGeo.map((g) => { const m = mk(g, heartM, scene); m.castShadow = false; m.visible = false; return m; });
let hs = null;
const tmpA = new V3(), tmpB = new V3();

function startHeart(F) {
  let side = player.pos.x < F.pos.x ? -1 : 1;
  if (Math.abs(F.pos.x + side * 2.7) > ROOM.x - 1.2) side = -side;
  hs = { F, side, phase: 'align', t: 0, from: player.pos.clone(), to: new V3(F.pos.x + side * 2.7, 0, F.pos.z), hinted: false };
  player.target = null; player.vel.set(0, 0, 0); player.y = 0; player.vy = 0;
  arrow.visible = false;
  $('hint').hidden = true;
}
function joinHeart() {
  if (hs && hs.phase === 'ready') { hs.phase = 'join'; hs.t = 0; SFX.swish(); setAct('jump'); }
}
function moveChar(R, dx) {
  if (R === player.R) player.pos.x += dx; else R.pos.x += dx;
  R.root.position.x += dx;
}
function updateHeart(dt) {
  const { F } = hs;
  hs.t += dt;
  const P = player.R;
  const left = hs.side < 0 ? P : F, right = hs.side < 0 ? F : P;
  turnTo(P, 0, dt, 8); turnTo(F, 0, dt, 8);
  if (hs.phase === 'align') {
    const k = Math.min(1, hs.t / 0.6), e = k * k * (3 - 2 * k);
    player.pos.lerpVectors(hs.from, hs.to, e);
    P.root.position.set(player.pos.x, 0, player.pos.z);
    animChar(P, dt, k < 1 ? 1 : 0, gameT);
    animChar(F, dt, 0, gameT);
    if (k >= 1) {
      hs.phase = 'ready'; hs.t = 0;
      left.pose = [null, 1.55]; right.pose = [-1.55, null];
      halves.forEach((h) => { h.visible = true; h.scale.setScalar(0.01); h.rotation.set(0, 0, 0); });
      SFX.sparkle();
      say(`¡Haz un corazón con ${F.def.name}!`);
      setAct('heart');
    }
    return;
  }
  animChar(P, dt, 0, gameT);
  animChar(F, dt, 0, gameT);
  const hL = left.hands[1].getWorldPosition(tmpA), hR = right.hands[0].getWorldPosition(tmpB);
  const y = (hL.y + hR.y) / 2 + 0.1, z = Math.max(hL.z, hR.z) + 0.3;
  if (hs.phase === 'ready' || hs.phase === 'join') {
    const pop = Math.min(1, hs.t * 4) * HALF_SCALE;
    const bob = hs.phase === 'ready' ? Math.sin(hs.t * 5) * 0.05 : 0;
    halves[0].position.set(hL.x + HALF_W, y + bob, z);
    halves[1].position.set(hR.x - HALF_W, y + bob, z);
    if (hs.phase === 'ready') halves.forEach((h) => h.scale.setScalar(pop));
    if (hs.phase === 'ready') {
      if (hs.t > 3.5 && !hs.hinted) { hs.hinted = true; say('¡Toca la pantalla para juntar los corazones!'); }
      if (hs.t > 10) joinHeart();
    } else {
      const gap = (hR.x - HALF_W) - (hL.x + HALF_W);
      if (gap > 0.01) {
        const step = Math.min(gap / 2, 1.6 * dt);
        moveChar(left, step); moveChar(right, -step);
        left.root.rotation.z = -0.08; right.root.rotation.z = 0.08;
      } else {
        hs.phase = 'merged'; hs.t = 0;
        hs.mid = new V3((hL.x + HALF_W + hR.x - HALF_W) / 2, y, z);
        halves[0].position.x = halves[1].position.x = hs.mid.x;
        left.root.rotation.z = right.root.rotation.z = 0;
        SFX.heart();
        burst(hs.mid.clone(), 40, { mats: pinkMats, speed: 3.5, up: 5 });
        say(`¡Un corazón con ${F.def.name}! ${NUM_M[prog.n]}`);
        P.cheer = 0; F.cheer = 0;
      }
    }
  } else if (hs.phase === 'merged') {
    const t = hs.t;
    const pulse = t < 0.8 ? 1 + Math.sin(t * 14) * 0.12 * (1 - t / 0.8) : 1;
    const rise = Math.max(0, t - 0.8);
    halves.forEach((h) => {
      h.scale.setScalar(HALF_SCALE * pulse * (1 + rise * 0.4));
      h.position.set(hs.mid.x, hs.mid.y + rise * rise * 2.2 + rise, hs.mid.z);
    });
    halves[0].rotation.y = halves[1].rotation.y = rise * 5;
    if (t > 0.8 && left.pose[1] != null) { left.pose = [null, null]; right.pose = [null, null]; P.cheer = 1.4; F.cheer = 1.4; }
    if (t > 1.9) {
      burst(halves[0].position.clone(), 30, { mats: pinkMats, speed: 3, up: 3 });
      SFX.sparkle();
      halves.forEach((h) => { h.visible = false; });
      F.hearted = true;
      F.found = true;
      F.order = friends.filter((f) => f.found).length - 1;
      F.hop = 0.01;
      hs = null;
      trail.push(player.pos.clone());
      addProgress();
    }
  }
}

const HOOP_COLS = [['#ff4fa3', '#ffffff'], ['#a66be0', '#ffd23f'], ['#2fc4b6', '#ffffff'], ['#ffd23f', '#ff7a1a'], ['#5ab0f0', '#ffffff'], ['#ff8fc8', '#a66be0']];
const hoopGeo = new THREE.TorusGeometry(0.68, 0.05, 10, 56);
const hoops = [];
const hula = { stars: 0, turns: 0, idle: 0 };
function makeHoop(cols) {
  const m = new THREE.Mesh(hoopGeo, new THREE.MeshStandardMaterial({ map: stripeTex(cols, 16), roughness: 0.35 }));
  m.castShadow = true;
  m.visible = false;
  scene.add(m);
  return m;
}
function startHula() {
  hideHoops();
  const cast = [player.R, ...friends];
  cast.forEach((R, i) => {
    if (!hoops[i]) hoops[i] = { mesh: makeHoop(HOOP_COLS[i % HOOP_COLS.length]) };
    const h = hoops[i];
    Object.assign(h, { R, phi: rand(0, TAU), w: i ? rand(6.5, 8.5) : 0, y: i ? R.waist : 0.08, auto: i > 0 });
    h.mesh.visible = true;
  });
  hula.stars = 0; hula.turns = 0; hula.idle = 0;
}
function hideHoops() {
  for (const h of hoops) { h.mesh.visible = false; if (h.R) { h.R.body.position.x = 0; h.R.body.position.z = 0; } h.R = null; }
}
function spin() {
  const h = hoops[0];
  if (!h || !h.R || state !== 'play') return;
  h.w = Math.min(12, h.w + 1.6);
  hula.idle = 0;
  SFX.whoosh(Math.min(8, Math.floor(h.w)));
  $('hint').hidden = true;
}
function updateHoop(h, dt) {
  const R = h.R;
  if (!h.auto) h.w = Math.max(0, h.w - (0.9 + 0.12 * h.w) * dt);
  h.phi += h.w * dt;
  const good = clamp((h.w - 1.5) / 3, 0, 1);
  const ty = 0.08 + (R.waist - 0.08) * good;
  h.y += (ty - h.y) * Math.min(1, dt * (ty < h.y ? 1.4 : 4));
  const lift = clamp((h.y - 0.08) / (R.waist - 0.08), 0, 1);
  const off = 0.3 * lift;
  const P = R.root.position;
  h.mesh.position.set(P.x + Math.cos(h.phi) * off, P.y + h.y, P.z + Math.sin(h.phi) * off);
  const tilt = 0.16 * lift;
  h.mesh.rotation.set(Math.PI / 2 + Math.sin(h.phi) * tilt, Math.cos(h.phi) * tilt, 0);
  R.body.position.x = -Math.cos(h.phi) * 0.07 * lift;
  R.body.position.z = -Math.sin(h.phi) * 0.07 * lift;
  const wave = Math.sin(gameT * 4 + R.h) * 0.2;
  R.pose = lift > 0.5 ? [-1.25 - wave, 1.25 + wave] : [null, null];
  return lift;
}
function updateHula(dt) {
  for (let i = 0; i < hoops.length; i++) {
    const h = hoops[i];
    if (!h.R) continue;
    const lift = updateHoop(h, dt);
    animChar(h.R, dt, 0, gameT);
    if (i === 0 && state === 'play') {
      if (h.w >= 4 && lift > 0.8) {
        hula.turns += h.w * dt / TAU;
        if (hula.turns >= 4) {
          hula.turns -= 4;
          hula.stars++;
          const at = h.mesh.position.clone(); at.y += 0.4;
          burst(at, 24, { mats: goldMats, speed: 3, up: 5 });
          SFX.chime(hula.stars - 1);
          say(NUM_F[hula.stars - 1], { show: false });
          addProgress();
        }
      }
      hula.idle = h.w < 2 ? hula.idle + dt : 0;
      if (hula.idle > 4.5) {
        hula.idle = 0;
        say('¡Toca rápido, rápido, para girar el aro!');
        showHint('👆 ¡Toca la pantalla muchas veces!', 4000);
      }
    }
  }
}

/* ============================================================
   Controles
   ============================================================ */
const ray = new THREE.Raycaster();
const floorPlane = new THREE.Plane(new V3(0, 1, 0), 0);
let pointerDown = false, downAt = null;
function pointerToFloor(e) {
  const r = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = new V3();
  return ray.ray.intersectPlane(floorPlane, hit) ? hit : null;
}
function setTarget(e, ring) {
  if (state !== 'play' && state !== 'celebrate') return;
  if (LEVELS[levelIdx].id !== 'hearts' || hs) return;
  const p = pointerToFloor(e);
  if (!p) return;
  p.x = clamp(p.x, -ROOM.x + 0.6, ROOM.x - 0.6);
  p.z = clamp(p.z, ROOM.zBack + 0.6, ROOM.zFront - 0.6);
  player.target = p;
  if (ring) { tapRing.position.set(p.x, 0.03, p.z); tapRing.material.opacity = 0.9; tapRing.scale.setScalar(0.6); }
}
const cv = renderer.domElement;
cv.addEventListener('pointerdown', (e) => {
  pointerDown = true; downAt = { x: e.clientX, y: e.clientY };
  cv.setPointerCapture?.(e.pointerId);
  initAudio();
  if (state !== 'play') return;
  const id = LEVELS[levelIdx].id;
  if (id === 'hearts') {
    if (hs && hs.phase === 'ready') joinHeart();
    else { setTarget(e, true); $('hint').hidden = true; }
  } else if (id === 'hula') spin();
});
cv.addEventListener('pointermove', (e) => { if (pointerDown) setTarget(e, false); });
const up = (e) => {
  if (pointerDown && downAt && state === 'play' && LEVELS[levelIdx].id === 'cones') {
    const dx = e.clientX - downAt.x, dy = e.clientY - downAt.y;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) changeLane(dx > 0 ? 1 : -1);
    else if (dy < -40) doJump();
    else changeLane(e.clientX < innerWidth / 2 ? -1 : 1);
  }
  pointerDown = false; downAt = null;
};
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', () => { pointerDown = false; downAt = null; });
cv.addEventListener('contextmenu', (e) => e.preventDefault());

function doJump() {
  if (state !== 'play' && state !== 'celebrate') return;
  if (hs) return;
  if (player.y <= 0.001) { player.vy = 8; SFX.jump(); }
}
function act() {
  if (state !== 'play' && state !== 'celebrate') return;
  const kind = $('actBtn').dataset.kind;
  if (kind === 'heart') joinHeart();
  else if (kind === 'spin') spin();
  else doJump();
}
$('actBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); initAudio(); act(); });
$('leftBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); initAudio(); changeLane(-1); });
$('rightBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); initAudio(); changeLane(1); });
$('musicBtn').addEventListener('click', () => { initAudio(); setMusic(!musicOn); });
$('homeBtn').addEventListener('click', goTitle);
$('againBtn').addEventListener('click', goTitle);
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if (k === 'm') { initAudio(); setMusic(!musicOn); return; }
  if (state === 'title' && ['1', '2', '3'].includes(k)) { startGame(+k - 1); return; }
  if (state === 'final' && k === 'enter') { goTitle(); return; }
  if (state === 'play' && !e.repeat) {
    const id = LEVELS[levelIdx].id;
    if (id === 'cones') {
      if (k === 'arrowleft' || k === 'a') { changeLane(-1); return; }
      if (k === 'arrowright' || k === 'd') { changeLane(1); return; }
      if (k === 'arrowup' || k === 'w') { doJump(); return; }
    }
    if (id === 'hula' && (k === ' ' || k === 'enter' || k.startsWith('arrow'))) { spin(); return; }
    if (id === 'hearts' && hs && hs.phase === 'ready' && (k === ' ' || k === 'enter')) { joinHeart(); return; }
  }
  if (k === ' ') { act(); return; }
  keys.add(k);
});
addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

/* ---------- Miniaturas de personajes para el menú ---------- */
(function makeThumbs() {
  const holder = $('picks');
  let r2 = null;
  try { r2 = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); } catch (e) { r2 = null; }
  PLAYABLE.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'pick';
    btn.style.setProperty('--c', p.color);
    btn.setAttribute('aria-label', `Jugar con ${p.name}`);
    const img = document.createElement('img');
    img.alt = '';
    if (r2) {
      r2.setSize(256, 256, false);
      r2.toneMapping = THREE.ACESFilmicToneMapping; r2.toneMappingExposure = 1.15;
      const sc = new THREE.Scene();
      addLights(sc, false);
      const R = p.make();
      R.root.rotation.y = 0.25;
      sc.add(R.root);
      const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
      cam.position.set(0, R.h * 0.72, 4.6);
      cam.lookAt(0, R.h * 0.62, 0);
      r2.render(sc, cam);
      img.src = r2.domElement.toDataURL('image/png');
    }
    btn.append(img);
    const name = document.createElement('span');
    name.textContent = p.name;
    btn.append(name);
    btn.addEventListener('click', () => startGame(i));
    holder.append(btn);
  });
  if (r2) { r2.dispose(); r2.forceContextLoss?.(); }
})();

/* ============================================================
   Bucle principal
   ============================================================ */
const camPos = new V3(0, 5, 14), camLook = new V3(0, 1.5, 1);
let confettiT = 0;

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 0.8 ? 62 : 50;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

function updatePlayer(dt) {
  const R = player.R;
  let ix = 0, iz = 0;
  if (keys.has('arrowleft') || keys.has('a')) ix -= 1;
  if (keys.has('arrowright') || keys.has('d')) ix += 1;
  if (keys.has('arrowup') || keys.has('w')) iz -= 1;
  if (keys.has('arrowdown') || keys.has('s')) iz += 1;
  const speed = 5.6;
  const want = new V3();
  if (ix || iz) {
    player.target = null;
    want.set(ix, 0, iz).normalize().multiplyScalar(speed);
  } else if (player.target) {
    const d = new V3(player.target.x - player.pos.x, 0, player.target.z - player.pos.z);
    const dist = d.length();
    if (dist < 0.2) player.target = null;
    else want.copy(d.multiplyScalar(Math.min(speed, dist * 4) / dist));
  }
  player.vel.lerp(want, Math.min(1, dt * 10));
  const before = player.pos.clone();
  player.pos.addScaledVector(player.vel, dt);
  collide(player.pos, 0.55);
  const moved = Math.hypot(player.pos.x - before.x, player.pos.z - before.z) / Math.max(dt, 1e-4);
  if (player.target && moved < 0.4 && want.length() > 1) {
    player.stuck += dt;
    if (player.stuck > 0.6) { player.target = null; player.stuck = 0; }
  } else player.stuck = 0;

  player.vy -= 22 * dt;
  player.y += player.vy * dt;
  if (player.y < 0) { if (player.vy < -6) SFX.boing(); player.y = 0; player.vy = 0; }

  R.root.position.set(player.pos.x, player.y, player.pos.z);
  if (moved > 0.3) turnTo(R, Math.atan2(player.vel.x, player.vel.z), dt);
  animChar(R, dt, player.y > 0 ? 0.3 : clamp(moved / speed, 0, 1), gameT);

  const last = trail[trail.length - 1];
  if (!last || last.distanceTo(player.pos) > 0.12) {
    trail.push(player.pos.clone());
    if (trail.length > 600) trail.shift();
  }
  // ¿Llegamos a un gatito?
  if (state === 'play') {
    for (const F of friends) {
      if (F.hearted || F.found) continue;
      if (Math.hypot(F.pos.x - player.pos.x, F.pos.z - player.pos.z) < 1.9) { startHeart(F); break; }
    }
  }
}

function updateFriends(dt) {
  for (const F of friends) {
    if (!F.root.visible || (hs && hs.F === F)) continue;
    let amt = 0;
    if (F.found && state !== 'final') {
      const idx = trail.length - 1 - (F.order + 1) * 14;
      const goal = trail[Math.max(0, idx)];
      if (goal && idx > 0) {
        const d = new V3(goal.x - F.pos.x, 0, goal.z - F.pos.z);
        const dist = d.length();
        if (dist > 0.05) {
          const step = Math.min(dist, Math.max(5.6, dist * 3) * dt);
          F.pos.addScaledVector(d.normalize(), step);
          amt = clamp(step / dt / 5.6, 0, 1);
          turnTo(F, Math.atan2(d.x, d.z), dt, 8);
        }
      }
    } else if (!F.found) {
      // Esperando: saluda con la manita de vez en cuando
      F.root.rotation.y += Math.sin(gameT * 1.3 + F.h * 3) * 0.4 * dt;
      if (Math.sin(gameT * 1.1 + F.h * 5) > 0.93) F.cheer = 0.3;
    }
    let y = 0;
    if (F.hop > 0) {
      F.hop += dt;
      y = Math.sin(Math.min(1, F.hop / 0.5) * Math.PI) * 0.9;
      F.root.rotation.y += dt * 12;
      if (F.hop > 0.5) F.hop = 0;
    }
    F.root.position.set(F.pos.x, y, F.pos.z);
    animChar(F, dt, amt, gameT);
  }
}

function updateArrow() {
  if (state !== 'play' || LEVELS[levelIdx].id !== 'hearts' || hs) { arrow.visible = false; return; }
  let best = null, bd = Infinity;
  for (const F of friends) {
    if (F.hearted) continue;
    const d = Math.hypot(F.pos.x - player.pos.x, F.pos.z - player.pos.z);
    if (d < bd) { bd = d; best = F; }
  }
  if (!best || bd < 2.6) { arrow.visible = false; return; }
  arrow.visible = true;
  const a = Math.atan2(best.pos.x - player.pos.x, best.pos.z - player.pos.z);
  const pulse = 1.2 + Math.sin(gameT * 6) * 0.15;
  arrow.position.set(player.pos.x + Math.sin(a) * pulse, 0.05, player.pos.z + Math.cos(a) * pulse);
  arrow.rotation.set(-Math.PI / 2, a + Math.PI, 0);
  if (!hinted && gameT - lastProgress > 14) {
    hinted = true;
    say('¡Sigue la flecha morada!');
  }
}

function updateCamera(dt) {
  let wantPos, wantLook;
  const portrait = camera.aspect < 0.8;
  const k = portrait ? 1.35 : 1;
  const id = LEVELS[levelIdx].id;
  if (state === 'title') {
    wantPos = new V3(Math.sin(gameT * 0.25) * 1.2, 3.8, 10.4);
    wantLook = new V3(0, 1.8, 0.5);
  } else if (state === 'final') {
    wantPos = new V3(0, 4.2, portrait ? 19 : 13.5);
    wantLook = new V3(0, 1.6, 0.4);
  } else if (id === 'cones') {
    wantPos = new V3(run.x * 0.5, 3.8 * k, 7.2 * k);
    wantLook = new V3(run.x * 0.6, 1.0, -5);
  } else if (id === 'hula') {
    wantPos = new V3(0, 3.0, portrait ? 15 : 10.6);
    wantLook = new V3(0, 1.3, 1.4);
  } else if (hs) {
    const cx = (player.pos.x + hs.F.pos.x) / 2;
    wantPos = new V3(cx, 3.4, player.pos.z + 6.5 * k);
    wantLook = new V3(cx, 1.3, player.pos.z);
  } else {
    wantPos = new V3(player.pos.x * 0.85, 8.2 * k, player.pos.z + 9.5 * k);
    wantLook = new V3(player.pos.x * 0.92, 1.0, player.pos.z - 1.2);
  }
  const f = 1 - Math.exp(-3.2 * dt);
  camPos.lerp(wantPos, f);
  camLook.lerp(wantLook, f);
  camera.position.copy(camPos);
  camera.lookAt(camLook);
}

const clock = new THREE.Clock();
function frame() {
  step(Math.min(clock.getDelta(), 0.05));
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
function step(dt) {
  gameT += dt;
  stateT += dt;

  if (state === 'title') {
    heroes.forEach((R, i) => {
      const hop = Math.max(0, Math.sin(gameT * 2.2 + i * 2.1));
      R.root.position.y = hop > 0.97 ? (hop - 0.97) * 12 : 0;
      if (Math.random() < 0.004) R.cheer = 1.2;
      animChar(R, dt, 0, gameT);
    });
    friends.forEach((R) => { if (Math.random() < 0.003) R.cheer = 1.0; animChar(R, dt, 0, gameT); });
  } else if (state === 'play' || state === 'celebrate') {
    const id = LEVELS[levelIdx].id;
    if (id === 'cones') updateRun(dt);
    else if (id === 'hearts') {
      if (hs) updateHeart(dt); else updatePlayer(dt);
      updateFriends(dt);
      updateArrow();
    } else updateHula(dt);
  } else if (state === 'final') {
    const cast = [...heroes, ...friends];
    for (const R of cast) {
      R.root.position.y = Math.abs(Math.sin(gameT * 4.5 + R.dance)) * 0.6;
      if (Math.sin(gameT * 0.9 + R.dance) > 0.92) R.root.rotation.y += dt * 9;
      else turnTo(R, -R.root.position.x * 0.06, dt, 4);
      R.cheer = 0.5;
      animChar(R, dt, 0, gameT);
    }
    confettiT -= dt;
    if (confettiT <= 0) {
      confettiT = 0.18;
      burst(new V3(rand(-8, 8), 7.5, rand(-2, 3)), 8, { speed: 1.2, up: 0.5 });
    }
  }
  updateParts(dt);
  if (tapRing.material.opacity > 0) {
    tapRing.material.opacity = Math.max(0, tapRing.material.opacity - dt * 1.6);
    tapRing.scale.multiplyScalar(1 + dt * 1.2);
  }
  updateCamera(dt);
}

setAct('jump');
placeTitle();
camera.position.copy(camPos);
requestAnimationFrame(frame);

// Ganchos para pruebas automáticas
window.__juego = {
  get state() { return state; }, get level() { return levelIdx; }, get hs() { return hs; }, prog, run, hula, player, friends, hoops,
  startGame, startLevel, changeLane, tick: (n) => { for (let i = 0; i < n; i++) step(1 / 30); }, act, joinHeart, spin, startHeart,
};
</script>
</body>
</html>
