<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sala de Juegos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root {
    --bg: #05060d;
    --panel: #0e1124;
    --line: #262b52;
    --accent: #ffd23f;
    --text: #e9eaff;
    --muted: #8d92bd;
    --font-arcade: "Press Start 2P", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 40px 16px 48px;
    background: radial-gradient(ellipse at top, #1b1640 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
  }
  header { text-align: center; margin-bottom: 36px; }
  h1 {
    font-family: var(--font-arcade);
    font-size: clamp(22px, 5vw, 40px);
    color: var(--accent);
    text-shadow: 4px 4px 0 #000, 0 0 24px rgba(255, 210, 63, .35);
    margin: 0 0 14px;
    letter-spacing: 2px;
  }
  header p { color: var(--muted); margin: 0; font-size: 15px; }
  .grid {
    max-width: 980px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .card {
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    color: inherit;
    text-decoration: none;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 10px 30px rgba(255, 210, 63, .15);
    outline: none;
  }
  .thumb { aspect-ratio: 16 / 9; display: block; width: 100%; background: #000; }
  .info { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .info h2 { font-family: var(--font-arcade); font-size: 13px; line-height: 1.5; margin: 0; color: #fff; }
  .info p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { font-size: 11px; color: var(--text); background: #171b3a; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; }
  .play { font-family: var(--font-arcade); font-size: 10px; color: var(--accent); }
  .soon { opacity: .5; pointer-events: none; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 40px; }
</style>
</head>
<body>
<header>
  <h1>SALA DE JUEGOS</h1>
  <p>Juegos de recreativa hechos en JavaScript. Elige uno y a jugar.</p>
</header>
<main class="grid" id="games"></main>
<footer>Funcionan en el navegador, con teclado o en el móvil.</footer>

<script>

    </svg>`,
  },
  {

    desc: "El clásico laberinto con Godzilla comiendo puntos mientras Ghidorah, Mothra, Mechagodzilla y Rodan le persiguen.",
    tags: ["Laberinto", "1 jugador"],
    thumb: `<svg viewBox="0 0 320 180" class="thumb" aria-hidden="true">
      <rect width="320" height="180" fill="#04050c"/>
      <g fill="none" stroke="#2b3cff" stroke-width="4" stroke-linejoin="round">
        <rect x="14" y="14" width="292" height="152" rx="10"/>
        <path d="M60 50 h60 M200 50 h60 M60 130 h60 M200 130 h60 M160 30 v40 M160 110 v40"/>
      </g>
      <g fill="#ffcf9e">${Array.from({ length: 11 }, (_, i) => `<circle cx="${40 + i * 24}" cy="90" r="3"/>`).join("")}</g>
      <circle cx="40" cy="90" r="7" fill="#ffcf9e"/>

      <path d="M252 104 v-18 a14 14 0 0 1 28 0 v18 l-5 -5 l-5 5 l-4 -5 l-4 5 l-5 -5z" fill="#8e9bb0"/>
      <circle cx="222" cy="86" r="3" fill="#fff"/><circle cx="231" cy="86" r="3" fill="#fff"/>

    </svg>`,
  },
];

const root = document.getElementById("games");
for (const g of GAMES) {
  const a = document.createElement("a");
  a.className = "card";
  a.href = g.href;
  a.innerHTML = `${g.thumb}
    <div class="info">
      <h2>${g.title}</h2>
      <p>${g.desc}</p>
      <div class="tags">${g.tags.map(t => `<span>${t}</span>`).join("")}</div>
      <span class="play">▶ JUGAR</span>
    </div>`;
  root.appendChild(a);
}
</script>
</body>
</html>
